# Opt in with SPRING_PROFILES_ACTIVE=identityos-oidc. Existing profile is unchanged.
identity.os.oidc.enabled=true
spring.security.oauth2.client.provider.identityos.issuer-uri=${IDENTITY_OS_ISSUER:http://localhost:8085/realms/identity-os}
spring.security.oauth2.client.registration.identityos.provider=identityos
spring.security.oauth2.client.registration.identityos.client-id=${IDENTITY_OS_OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.identityos.client-secret=${IDENTITY_OS_OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.identityos.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.identityos.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.identityos.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.identityos.scope=openid,profile,email
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${IDENTITY_OS_SECURE_COOKIE:true}
server.servlet.session.timeout=30m
